# @package _global_
# Paper reproduction: BASED-1B -> degree-2 LLoPS with a linear term.
defaults:
  - /experiment/pile/gpt3m-flash.yaml
  - override /datamodule: slim6B

name: llops-1b
expt_name: ${name}
resume: false
test_after_training: false

model:
  _target_: based.models.gpt_unified.GPTSketchLMHeadModel
  _recursive_: false
  train_from_scratch: false
  # The paper run used a local BASED-1B initializer. Set this explicitly so a
  # different public checkpoint is never mistaken for the reproduced run.
  init_model_name: ${oc.env:INIT_MODEL_NAME}
  power: 1
  use_linear_term: true

datamodule:
  batch_size: 2
  batch_size_eval: 12

trainer:
  devices: ${oc.env:NUM_GPUS,8}
  num_nodes: ${oc.env:NUM_NODES,1}
  accumulate_grad_batches: 16
  max_epochs: 1000
  max_steps: 2000
  min_epochs: 0
  val_check_interval: ${eval:250 * ${.accumulate_grad_batches}}

train:
  optimizer:
    _target_: torch.optim.AdamW
    adam_w_mode: null
    lr: 1.0e-5
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 0.1
  scheduler:
    _target_: train.optim.timm_lr_scheduler.TimmCosineLRScheduler
    lr_min: 4.0e-6
    warmup_t: 200
    t_initial: 19800
    t_in_epochs: false
    warmup_prefix: true
    warmup_lr_init: 1.0e-6

callbacks:
  model_checkpoint:
    _target_: train.callbacks.model_checkpoint.ModelCheckpointMine
    dirpath: ${oc.env:CHECKPOINT_DIR,${work_dir}/checkpoints}/${name}
    every_n_train_steps: 250
    save_last: true
    save_top_k: -1
    filename: step_{step}
    monitor: val/loss
    mode: min
    auto_insert_metric_name: false
    save_hf: true

logger: null
